# Runs the test suite, a formatting check and coverage upload on every push to
# master and every pull request targeting it.
name: Node.js CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with "engines.node" in package.json.
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      # No install step: the package has no runtime dependencies and the tests
      # run on node:test / node:assert, so this exercises exactly what a
      # consumer would get. The release toolchain needs a newer Node than the
      # oldest supported version, so installing it here would only add noise.
      - run: npm test

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"
      # Also validates that package-lock.json is in sync with package.json.
      - run: npm ci
      - run: npm run format:check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm run coverage:lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Single stable status check for branch protection. The Test job is a matrix,
  # so its contexts are "Test (20.x)" etc. and change whenever the matrix
  # changes; requiring those directly would wedge every PR the moment a Node
  # version is added or dropped. This job's name never changes.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [build, format]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          echo "Test:   ${{ needs.build.result }}"
          echo "Format: ${{ needs.format.result }}"
          [ "${{ needs.build.result }}" = "success" ] || exit 1
          [ "${{ needs.format.result }}" = "success" ] || exit 1
