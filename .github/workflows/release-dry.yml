# Validates the semantic-release configuration and previews the next version on
# every pull request.
#
# NOTE: the job is still called "Dry Release" because that is the required
# status check configured on master. semantic-release itself cannot be used
# here - it returns early on pull_request events without checking anything.
name: Dry Release

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-dry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Dry Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify release config and preview next version
        run: node scripts/verify-release-config.mjs
